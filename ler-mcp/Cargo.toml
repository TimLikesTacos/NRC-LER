[package]
name = "ler-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
clap = { version = "4.6.7", features = ["derive", "env"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.37.0"
rmcp = { version = "3.10.0", features = ["server", "transport-io", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "0.42", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
