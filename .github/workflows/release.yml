# Build ler-mcp for Linux, macOS and Windows and attach the binaries to a GitHub Release.
#
# Trigger: push a version tag, e.g.
#   git tag v0.1.0 && git push origin v0.1.0
# The database is not built here (it needs API keys and hours of pulling): upload it to the
# same release yourself, e.g.
#   gzip -9 -k lers_analysis.db && gh release upload v0.1.0 lers_analysis.db.gz
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  ext: "",     test: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: "",     test: true }
          - { os: macos-latest,     target: aarch64-apple-darwin,      ext: "",     test: true }
          # Intel Mac: cross-compiled on the Apple Silicon runner (GitHub retired its Intel macOS
          # runners), so its tests can't run there; the arm64 build above runs them.
          - { os: macos-latest,     target: x86_64-apple-darwin,       ext: "",     test: false }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    ext: ".exe", test: true }
    defaults:
      run:
        working-directory: ler-mcp
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ler-mcp
          key: ${{ matrix.target }}

      # Unit tests only: the evals and DB-backed tests need lers_analysis.db, which isn't in git.
      - name: test
        if: matrix.test
        run: cargo test --release --locked --target ${{ matrix.target }} --bins

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: package
        id: package
        run: |
          name="ler-mcp-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/ler-mcp${{ matrix.ext }}" "$name/"
          cp ../README.md ../LICENSE "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" >/dev/null
            echo "file=ler-mcp/$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "$name.tar.gz" "$name"
            echo "file=ler-mcp/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.file }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
